version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=kt;Username=postgres;Password=postgres;Trust Server Certificate=true;
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: kt_postgres
    environment:
      - POSTGRES_DB=kt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - kt_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  kt_postgres_data:
