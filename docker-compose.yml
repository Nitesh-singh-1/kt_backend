version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kt_api
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-kt};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env};Trust Server Certificate=true;
      - JwtSettings__Secret=${JWT_SECRET:?Set JWT_SECRET in .env to a random 32+ character string}
      - JwtSettings__Issuer=${JWT_ISSUER:-KTransportAPI}
      - JwtSettings__Audience=${JWT_AUDIENCE:-KTransportClient}
      - JwtSettings__ExpiryInMinutes=${JWT_EXPIRY:-60}
      - Cors__AllowedOrigins__0=${CORS_ORIGIN_0:-http://localhost:3000}
      - Cors__AllowedOrigins__1=${CORS_ORIGIN_1:-}
      - Email__Enabled=${EMAIL_ENABLED:-false}
      - Email__Host=${EMAIL_HOST:-}
      - Email__Port=${EMAIL_PORT:-587}
      - Email__UseSsl=${EMAIL_USE_SSL:-true}
      - Email__Username=${EMAIL_USERNAME:-}
      - Email__Password=${EMAIL_PASSWORD:-}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS:-}
      - Email__FromName=${EMAIL_FROM_NAME:-KTransport}
      - App__FrontendBaseUrl=${FRONTEND_BASE_URL:-http://localhost:3000}
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.EntityFrameworkCore=Information
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kt_network

  postgres:
    image: postgres:${POSTGRES_VERSION:-17.1-alpine}
    container_name: kt_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-kt}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bound to localhost to prevent direct public exposure
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - kt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kt}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 3s
    restart: unless-stopped
    networks:
      - kt_network

networks:
  kt_network:
    driver: bridge

volumes:
  kt_postgres_data:

