# Builds the API image, pushes it to GHCR, then tells the VPS to pull + restart
# just the `api` service (docker-compose.yml on the VPS orchestrates api+web+postgres
# together; this workflow never touches web or postgres).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   SSH_HOST         VPS IP or hostname (e.g. 129.121.132.103)
#   SSH_USER         SSH user (e.g. root)
#   SSH_PRIVATE_KEY  Private half of the deploy keypair (the matching public key
#                    must already be in that user's ~/.ssh/authorized_keys on the VPS)
#
# GHCR push needs no secret — GITHUB_TOKEN is automatic; the `permissions:` block
# below grants it package-write for this workflow run only.

name: Deploy backend

on:
  push:
    branches: [main]

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  # Must exactly match the image ref used for `api` in kt_backend/docker-compose.yml.
  IMAGE: ghcr.io/nitesh-singh-1/kt_backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/ktransport
            docker compose pull api
            docker compose up -d api
            docker image prune -f
